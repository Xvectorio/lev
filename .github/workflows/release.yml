name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: lev-api, context: backend, file: backend/Dockerfile}
          - {name: lev-edge, context: ., file: ops/Dockerfile.edge}
          - {name: lev-vector, context: vector, file: vector/Dockerfile}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Attach install files pinned to this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          sed "s/LEV_VERSION:-latest/LEV_VERSION:-${TAG#v}/" compose.yaml > dist/compose.yaml
          sed "s/LEV_VERSION:-latest/LEV_VERSION:-${TAG#v}/" vector/compose.yaml > dist/vector-compose.yaml
          cp vector/.env.example dist/vector.env.example
          gh release create "$TAG" dist/* --title "Lev $TAG" --generate-notes
