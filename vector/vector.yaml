data_dir: /var/lib/vector
sources:
  heartbeat:
    type: demo_logs
    format: shuffle
    lines: ['{"service":"lev-heartbeat","level":"info","message":"collector heartbeat"}']
    interval: 60
  application_files:
    type: file
    include: [/host/var/log/apps/*/*.log]
    read_from: end
    multiline:
      start_pattern: '^\d{4}-\d{2}-\d{2}[T ]|^\{'
      condition_pattern: '^\d{4}-\d{2}-\d{2}[T ]|^\{'
      mode: halt_before
      timeout_ms: 1500
  container_files:
    type: file
    include: [/host/docker/containers/${VECTOR_CONTAINER_GLOB}/*-json.log]
    read_from: end
  system_journal:
    type: journald
    current_boot_only: false
    since_now: true
    extra_args: [--directory=/host/var/log/journal]
transforms:
  # Drop-in sources: watch.d/<thing>.yaml defines `src_<thing>` plus a `watch_<thing>` remap setting .lev_service.
  # watch_none keeps the wildcard valid when watch.d is empty; it never emits.
  watch_none:
    type: filter
    inputs: [heartbeat]
    condition: 'false'
  normalize:
    type: remap
    inputs: [application_files, container_files, system_journal, heartbeat, "watch_*"]
    source: |
      msg = string(.message) ?? ""
      outer = parse_json(msg) ?? {}
      msg = string(outer.log) ?? msg
      app = parse_json(msg) ?? {}
      msg = string(app.message) ?? string(app.msg) ?? msg
      stamp = string(app.timestamp) ?? string(app.time) ?? string(outer.time) ?? ""
      if stamp == "" {
        prefix = parse_regex(msg, r'^(?P<ts>\d{4}-\d{2}-\d{2}T[^ ]+)') ?? {}
        stamp = string(prefix.ts) ?? ""
      }
      event_time = parse_timestamp(stamp, format: "%+") ?? timestamp(.timestamp) ?? now()
      # A body timestamp is app-controlled: far off receive time it would land outside the collector's window. Use receive time.
      age = to_unix_timestamp(now()) - to_unix_timestamp(event_time)
      if age > 300 || age < -60 { event_time = now() }
      path = string(.file) ?? "journal"
      file_service = parse_regex(path, r'/apps/(?P<service>[^/]+)/') ?? {}
      service = string(.lev_service) ?? string(app.service) ?? string(file_service.service) ?? string(._SYSTEMD_USER_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? string(._SYSTEMD_UNIT) ?? "container"
      # service becomes a Loki label and may come from the log body: keep it short and plain so it can't mint streams at will.
      service = truncate(replace(service, r'[^A-Za-z0-9._@:-]', "_"), 64)
      kv = parse_logfmt(msg) ?? {}
      level = downcase(string(.lev_level) ?? string(app.level) ?? string(app.severity) ?? string(kv.level) ?? "")
      if level == "warning" { level = "warn" }
      if level == "err" { level = "error" }
      if level == "critical" || level == "crit" || level == "emerg" || level == "alert" { level = "fatal" }
      if level == "notice" { level = "info" }
      if level == "trace" { level = "debug" }
      priority = if exists(.PRIORITY) { to_int(.PRIORITY) ?? -1 } else { -1 }
      if !includes(["debug", "info", "warn", "error", "fatal"], level) {
        if priority >= 0 && priority <= 7 {
          level = if priority <= 2 { "fatal" } else if priority == 3 { "error" } else if priority == 4 { "warn" } else if priority == 7 { "debug" } else { "info" }
        } else {
          severity_text = replace(msg, r'(?i)\b(?:not[ -]+fatal|non[ -]?fatal|no errors?)\b', "")
          level = if match(severity_text, r'(?i)\b(fatal|panic)\b') { "fatal" } else if match(severity_text, r'(?i)\b(error|exception|failed|failure|out of memory|no space left)\b') { "error" } else if match(severity_text, r'(?i)\b(warn|warning)\b') { "warn" } else { "info" }
        }
      }
      # dockerd/BuildKit logs this when a finished build's client session closes: routine, not a failure.
      if match(msg, r'healthcheck failed.*only one connection allowed') { level = "info" }
      # Whitelist output fields; redact before forwarding or disk buffering.
      msg = replace(msg, r'(?i)(bearer\s+)[A-Za-z0-9._~+/=-]+', "Bearer [REDACTED]")
      # Header values (Basic/Digest credentials, every cookie) are redacted whole: quoted, or to end of line.
      msg = replace(msg, r'(?i)\b(?:proxy-)?authorization["\']?\s*[:=]\s*(?:"(?:[^"\\]|\\.)*"|\'[^\']*\'|[^\r\n]+)', "[REDACTED]")
      msg = replace(msg, r'(?i)\b(?:set-)?cookie["\']?\s*[:=]\s*(?:"(?:[^"\\]|\\.)*"|\'[^\']*\'|[^\r\n]+)', "[REDACTED]")
      # Key names may be prefixed or suffixed: SECRET_KEY, AWS_SECRET_ACCESS_KEY, db_password, access_token.
      msg = replace(msg, r'(?i)[\w.-]*(?:password|passwd|secret|token|api[_-]?key|access[_-]?key|private[_-]?key)(?:[_-]?(?:access[_-]?)?(?:key|token|id))?["\']?\s*[:=]\s*(?:"(?:[^"\\]|\\.)*"|\'[^\']*\'|[^\s,;}"\']+)', "[REDACTED]")
      msg = replace(msg, r'(?i)--[\w-]*(?:password|passwd|secret|token|api[_-]?key)[\w-]*\s+[^\s-]\S*', "[REDACTED]")
      msg = replace(msg, r'(?i)\b(?:password|identified\s+by)\s+\'[^\']*\'', "[REDACTED]")
      msg = replace(msg, r'://[^\s/:@]*:[^\s/@]+@', "://[REDACTED]@")
      msg = replace(msg, r'\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*', "[REDACTED]")
      msg = replace(msg, r'\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_\w{20,}|sk-[A-Za-z0-9_-]{20,}|xox[abprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16})', "[REDACTED]")
      msg = replace(msg, r'-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?(?:-----END [A-Z ]*PRIVATE KEY-----|$)', "[REDACTED]")
      # Retain IDs in the message body (after redaction, which may run to end of line), never in Loki labels.
      if exists(app.request_id) { msg = msg + " request_id=" + (to_string(app.request_id) ?? "") }
      if exists(app.order_id) { msg = msg + " order_id=" + (to_string(app.order_id) ?? "") }
      . = {"timestamp": event_time, "message": msg, "level": level, "host": "${VECTOR_HOST}", "server_id": "${VECTOR_SERVER_ID}", "project_id": "${VECTOR_PROJECT_ID}", "environment": "${VECTOR_ENVIRONMENT}", "service": service, "source": path, "process_id": to_string(._PID) ?? ""}
  multiline:
    type: reduce
    inputs: [normalize]
    group_by: [host, service, source, process_id]
    starts_when: |
      !match(string!(.message), r'^\s+|^Caused by:|^Traceback|^[A-Za-z.]+(?:Error|Exception):')
    expire_after_ms: 1500
    merge_strategies:
      message: concat_newline
      timestamp: discard
      level: discard
  exceptions:
    type: remap
    inputs: [multiline]
    source: |
      # The reduce keeps the head line's level; an exception merged under an info head must not be dropped.
      if (.level == "info" || .level == "debug") && match(string!(.message), r'(?m)^(?:Traceback|Caused by:|[A-Za-z.]+(?:Error|Exception):)') { .level = "error" }
      # Lev stores 16,000 characters per event; bigger lines only cost Loki and collector memory.
      .message = truncate(string!(.message), 16000)
  # Per-server overrides: watch.d/local.vrl (outside releases) may change .level or abort to drop; default is a no-op.
  local:
    type: remap
    inputs: [exceptions]
    file: ${LEV_LOCAL_VRL:-/etc/vector/local.vrl}
  relevant:
    type: filter
    inputs: [local]
    condition: '(.level == "warn" || .level == "error" || .level == "fatal") || .service == "lev-heartbeat"'
sinks:
  loki:
    type: loki
    inputs: [relevant]
    endpoint: ${VECTOR_ENDPOINT}
    auth:
      strategy: basic
      user: vector
      password: ${VECTOR_PASSWORD}
    labels:
      project_id: '{{ project_id }}'
      server_id: '{{ server_id }}'
      host: '{{ host }}'
      service: '{{ service }}'
      environment: '{{ environment }}'
    encoding:
      codec: json
    acknowledgements:
      enabled: true
    buffer:
      type: disk
      max_size: 536870912
      when_full: block
    healthcheck:
      enabled: false
tests:
  - name: redact secrets and preserve request identifiers
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: '{"timestamp":"2026-09-24T01:00:00Z","service":"checkout","level":"error","message":"connection failed password=hunter2 Authorization: Bearer abc123.def456","request_id":"req-42","secret":"must-not-leak"}'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")
              assert_eq!(.service, "checkout")
              assert_eq!(.project_id, "test-project")
              assert_eq!(.server_id, "test-server")
              assert!(!contains(string!(.message), "hunter2"))
              assert!(!contains(string!(.message), "abc123"))
              assert!(contains(string!(.message), "req-42"))
              assert!(!exists(.secret))
              # A stale body timestamp is replaced by receive time.
              assert!(to_unix_timestamp(now()) - to_unix_timestamp!(.timestamp) < 60)
  - name: parse Docker log envelopes
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          file: /host/docker/containers/test/test-json.log
          message: '{"log":"ERROR database connection failed\n","time":"2026-09-24T01:01:00Z","stream":"stderr"}'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "error")
              assert!(contains(string!(.message), "database connection failed"))
              assert!(to_unix_timestamp(now()) - to_unix_timestamp!(.timestamp) < 60)
  - name: join exception continuations
    inputs:
      - insert_at: multiline
        type: log
        log_fields:
          host: test-host
          service: app
          source: fixture
          level: error
          message: 'ERROR request failed'
      - insert_at: multiline
        type: log
        log_fields:
          host: test-host
          service: app
          source: fixture
          level: info
          message: '  at example.py:10'
    outputs:
      - extract_from: multiline
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "ERROR request failed\n  at example.py:10")
              assert_eq!(.level, "error")
  - name: exception under an informational head is kept as an error
    inputs:
      - insert_at: multiline
        type: log
        log_fields:
          host: test-host
          service: app
          source: fixture
          level: info
          message: Starting request
      - insert_at: multiline
        type: log
        log_fields:
          host: test-host
          service: app
          source: fixture
          level: info
          message: 'ValueError: bad input'
    outputs:
      - extract_from: relevant
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "Starting request\nValueError: bad input")
              assert_eq!(.level, "error")
  - name: redact Basic authorization headers
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR login failed Authorization: Basic dXNlcjpodW50ZXIy'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR") && !contains(m, "dXNlcjpodW50ZXIy"), m)
  - name: redact whole cookie headers
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR bad session Cookie: theme=dark; session=abc123secret'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR") && !contains(m, "abc123secret"), m)
  - name: redact quoted passwords
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR auth failed password="correct horse battery" user=bob'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR") && !contains(m, "horse"), m)
  - name: redact prefixed and suffixed key names
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR boot failed SECRET_KEY=s3kr1t AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI access_token: tok123 db_password=pw1'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "s3kr1t") && !contains(m, "wJalrXUtnFEMI") && !contains(m, "tok123") && !contains(m, "pw1"), m)
  - name: redact URL credentials and CLI flags
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR connect postgres://app:hunter2@db:5432/app failed; retry with --password hunter3'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "hunter2") && !contains(m, "hunter3"), m)
  - name: redact SQL passwords
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: "ERROR statement: ALTER ROLE app WITH PASSWORD 'hunter5'; CREATE USER x IDENTIFIED BY 'hunter6'"
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "hunter5") && !contains(m, "hunter6"), m)
  - name: redact JWTs
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR rejected eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.c2lnbmF0dXJl'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "eyJ"), m)
  - name: redact provider tokens
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'ERROR rejected ghp_abcdefghijklmnopqrstuvwxyz0123456789 sk-ant-api03-abcdefghijklmnopqrstuv AKIAIOSFODNN7EXAMPLE'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "ghp_") && !contains(m, "sk-ant") && !contains(m, "AKIA"), m)
  - name: redact PEM private keys
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: "ERROR bad key -----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA\n-----END RSA PRIVATE KEY----- loaded"
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "ERROR"), m)
              assert!(!contains(m, "MIIEow"), m)
  - name: common words near key names are kept
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'WARN model call hit max_tokens=4096 for tokenizer=gpt2 at postgres://db:5432/app'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              m = string!(.message)
              assert!(contains(m, "max_tokens=4096") && contains(m, "tokenizer=gpt2") && contains(m, "postgres://db:5432/app"), m)

  - name: service label is sanitized and truncated
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: '{"service":"shop {x=y} aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","level":"error","message":"boom"}'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: 'match(string!(.service), r''^[A-Za-z0-9._@:-]{1,64}$'') && starts_with(string!(.service), "shop_")'

  - name: forward warnings through the final filter
    inputs:
      - insert_at: relevant
        type: log
        log_fields:
          level: warn
          service: systemd
          message: journal warning
    outputs:
      - extract_from: relevant
        conditions:
          - type: vrl
            source: 'assert_eq!(.message, "journal warning")'

  - name: journal priority wins over fatal words
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: Errors from xkbcomp are not fatal to the X server
          PRIORITY: "4"
          _SYSTEMD_UNIT: user@1000.service
          _SYSTEMD_USER_UNIT: app-terminal.scope
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: |
              assert_eq!(.level, "warn")
              assert_eq!(.service, "app-terminal.scope")
  - name: logfmt severity wins over failure words
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: 'level=info msg="Container failed to exit during planned restart"'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: 'assert_eq!(.level, "info")'
  - name: fallback severity understands fatal negation
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          message: Warning - non-fatal diagnostic, not fatal
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: 'assert_eq!(.level, "warn")'
  - name: BuildKit session teardown is not a failure
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          _SYSTEMD_UNIT: docker.service
          message: 'time="2026-09-24T15:12:00.3+02:00" level=error msg="healthcheck failed fatally" error="session healthcheck failed fatally: Unavailable: connection error: desc = \\"transport: Error while dialing: only one connection allowed\\""'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: 'assert_eq!(.level, "info")'
  - name: other healthcheck failures still warn
    inputs:
      - insert_at: normalize
        type: log
        log_fields:
          _SYSTEMD_UNIT: docker.service
          message: 'level=warning msg="healthcheck failed" container=abc error="connection refused"'
    outputs:
      - extract_from: normalize
        conditions:
          - type: vrl
            source: 'assert_eq!(.level, "warn")'
  - name: local rules pass warnings through by default
    inputs:
      - insert_at: local
        type: log
        log_fields:
          message: disk almost full
          level: warn
    outputs:
      - extract_from: relevant
        conditions:
          - type: vrl
            source: 'assert_eq!(.level, "warn")'
